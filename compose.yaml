services:
  income-expense-bot:
    image: ghcr.io/davidalvarezcastro/income-expense-bot:latest
    env_file:
      - path: .env
        required: false
    environment:
      LEDGER_SQLITE_PATH: /data/ledger.sqlite
      LOG_FORMAT: json
    volumes:
      - ./data:/data
    user: "1000:1000"
    restart: unless-stopped
    mem_limit: 384m
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
